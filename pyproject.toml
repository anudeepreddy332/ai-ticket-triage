[project]
name = "ai-ticket-triage"
version = "0.1.0"
description = "Production-style asynchronous AI support ticket triage pipeline."
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.95",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "boto3-stubs[bedrock-runtime]>=1.43.95",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
